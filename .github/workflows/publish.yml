name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated distributions to PyPI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.11"
          python-version: "3.11"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test
        run: uv run --locked pytest -q
      - name: Lint and formatting
        run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - name: Build distributions
        run: uv build --no-sources
      - name: Check package metadata and description
        run: uvx twine check --strict dist/*
      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with ./dist/*.whl annolabel --version
      - name: Smoke test the source distribution
        run: uv run --isolated --no-project --with ./dist/*.tar.gz annolabel --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.11"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish using PyPI trusted publishing
        run: uv publish --trusted-publishing always

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create release at the published commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python3 - "$VERSION" <<'PY'
          import pathlib, sys
          text = pathlib.Path("CHANGELOG.md").read_text()
          section = text.split("## " + sys.argv[1] + " ", 1)[1]
          pathlib.Path("release-notes.md").write_text(section.split("\n", 1)[1].split("\n## ", 1)[0].strip() + "\n")
          PY
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "AnnoLabel $VERSION" --notes-file release-notes.md --latest
